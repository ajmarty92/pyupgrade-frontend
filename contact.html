<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact PyUpgrade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: -webkit-linear-gradient(45deg, #34D399, #3B82F6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .form-button-as-link {
            background: none; border: none; padding: 0; font: inherit; cursor: pointer; outline: inherit;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-300">

    <div id="site-header"></div>

    <main class="container mx-auto px-6 py-20">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-5xl md:text-6xl font-black text-white leading-tight">Get in <span class="gradient-text">Touch</span>.</h1>
            <p class="mt-6 text-lg text-gray-400">Have a question, a feature request, or need to talk about an enterprise plan? We'd love to hear from you.</p>
        </div>
        
        <div class="max-w-xl mx-auto mt-16 bg-gray-800/60 border border-gray-700 rounded-xl p-8">
             <form id="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="company">
                <input type="hidden" name="form-name" value="contact">
                <p class="hidden"><label>Don't fill this out if you're human: <input name="company"></label></p>
                <div class="grid grid-cols-1 gap-y-6 gap-x-8 sm:grid-cols-2">
                    <div>
                        <label for="first-name" class="block text-sm font-semibold leading-6 text-gray-200">First name</label>
                        <div class="mt-2.5"><input type="text" name="first-name" id="first-name" autocomplete="given-name" required class="block w-full rounded-md border-0 bg-gray-900/70 px-3.5 py-2 text-white shadow-sm ring-1 ring-inset ring-gray-600 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-emerald-500 sm:text-sm sm:leading-6"></div>
                    </div>
                    <div>
                        <label for="last-name" class="block text-sm font-semibold leading-6 text-gray-200">Last name</label>
                        <div class="mt-2.5"><input type="text" name="last-name" id="last-name" autocomplete="family-name" required class="block w-full rounded-md border-0 bg-gray-900/70 px-3.5 py-2 text-white shadow-sm ring-1 ring-inset ring-gray-600 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-emerald-500 sm:text-sm sm:leading-6"></div>
                    </div>
                    <div class="sm:col-span-2">
                        <label for="email" class="block text-sm font-semibold leading-6 text-gray-200">Email</label>
                        <div class="mt-2.5"><input type="email" name="email" id="email" autocomplete="email" required class="block w-full rounded-md border-0 bg-gray-900/70 px-3.5 py-2 text-white shadow-sm ring-1 ring-inset ring-gray-600 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-emerald-500 sm:text-sm sm:leading-6"></div>
                    </div>
                    <div class="sm:col-span-2">
                        <label for="message" class="block text-sm font-semibold leading-6 text-gray-200">Message</label>
                        <div class="mt-2.5"><textarea name="message" id="message" rows="4" required class="block w-full rounded-md border-0 bg-gray-900/70 px-3.5 py-2 text-white shadow-sm ring-1 ring-inset ring-gray-600 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-emerald-500 sm:text-sm sm:leading-6"></textarea></div>
                    </div>
                </div>
                <p id="contact-error" class="mt-4 text-sm text-red-400 hidden" role="alert"></p>
                <div class="mt-10">
                    <button type="submit" id="contact-submit" class="block w-full rounded-md bg-emerald-500 px-3.5 py-2.5 text-center text-sm font-semibold text-white shadow-sm hover:bg-emerald-600 active:bg-emerald-700 disabled:opacity-60 disabled:cursor-not-allowed transition focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600">Let's talk</button>
                </div>
            </form>
            <div id="contact-success" class="hidden text-center py-8" role="status">
                <h2 class="text-2xl font-bold text-white">Message sent.</h2>
                <p class="mt-2 text-gray-400">Thanks for reaching out — we'll get back to you soon.</p>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/site-chrome.js"></script>
    <script src="js/contact-form.js"></script>
</body>
</html>
