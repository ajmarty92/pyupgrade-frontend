<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PyUpgrade Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-950">
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      // --- FIX: Define BACKEND_URL Globally and Immediately ---
      const currentHostname = window.location.hostname;
      // IMPORTANT: Ensure this matches your Vercel domain exactly
      const vercelHostname = "pyupgrade-app.vercel.app";
      // IMPORTANT: Ensure this matches your Heroku domain exactly
      const productionBackendUrl =
        "https://pyupgrade-f203f8648dc3.herokuapp.com";
      const localBackendUrl = "http://localhost:8000";
      const isProduction = currentHostname === vercelHostname;
      const BACKEND_URL = isProduction ? productionBackendUrl : localBackendUrl;
      window.BACKEND_URL = BACKEND_URL;

      // Log the determined URL for debugging
      console.log("Determined Backend URL:", BACKEND_URL);
    </script>

    <script type="text/babel" src="src/App.js"></script>

    <script type="text/babel">
      // --- Wait for the window to load before running React code ---
      window.onload = function () {
        // --- Render the Application ---
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(React.createElement(window.App));
      };
    </script>
  </body>
</html>
