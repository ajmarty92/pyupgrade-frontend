<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyUpgrade Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-950">
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="js/Icons.js" type="text/babel"></script>
    <script src="js/AuthView.js" type="text/babel"></script>

    <script type="text/babel">
        // --- FIX: Define BACKEND_URL Globally and Immediately ---
        const currentHostname = window.location.hostname;
        // IMPORTANT: Ensure this matches your Vercel domain exactly
        const vercelHostname = 'pyupgrade-app.vercel.app'; 
        // IMPORTANT: Ensure this matches your Heroku domain exactly
        const productionBackendUrl = 'https://pyupgrade-f203f8648dc3.herokuapp.com'; 
        const localBackendUrl = 'http://localhost:8000';
        const isProduction = currentHostname === vercelHostname;
        const BACKEND_URL = isProduction ? productionBackendUrl : localBackendUrl;
        window.BACKEND_URL = BACKEND_URL;
        
        // Log the determined URL for debugging
        console.log("Determined Backend URL:", BACKEND_URL);

        // --- Wait for the window to load before running React code ---
        // Removed window.onload wrapper
            
        const { useState, useEffect } = React;

            // --- INLINE SVG ICON COMPONENTS ---

            // --- React Components (Using the globally defined BACKEND_URL) ---
            
            function App() {
                // (Logic remains the same)
                const [isLoggedIn, setIsLoggedIn] = useState(false); const [isLoading, setIsLoading] = useState(true); const [initialAction, setInitialAction] = useState('login');
                useEffect(() => { const qp = new URLSearchParams(window.location.search); if (qp.get('action') === 'signup') { setInitialAction('signup'); } const cs = async () => { try { const r = await fetch(`${BACKEND_URL}/api/me`, { credentials: 'include' }); setIsLoggedIn(r.ok); } catch (e) { setIsLoggedIn(false); } finally { setIsLoading(false); } }; cs(); }, []);
                if (isLoading) { return <div className="bg-gray-950 text-gray-200 min-h-screen flex justify-center items-center"><Loader2 className="w-16 h-16 animate-spin text-emerald-400" /></div>; }
                return <div className="bg-gray-950 text-gray-200 min-h-screen font-sans"><div className="container mx-auto px-4 h-screen">{isLoggedIn ? <MainAppView onLogout={() => setIsLoggedIn(false)} /> : <AuthView onLoginSuccess={() => setIsLoggedIn(true)} initialAction={initialAction} />}</div></div>;
            }


            const MainAppView = ({ onLogout }) => {
                 // (Logic remains the same)
                const [appState, setAppState] = useState('repo_selection'); const [scanResult, setScanResult] = useState(null); const [repos, setRepos] = useState([]); const [isLoadingRepos, setIsLoadingRepos] = useState(true); const [error, setError] = useState(null);
                useEffect(() => { const fr = async () => { setIsLoadingRepos(true); setError(null); try { const r = await fetch(`${BACKEND_URL}/api/repositories`, { credentials: 'include' }); if (!r.ok) { const ed = await r.json(); if (r.status === 403) { throw new Error("Link GitHub account."); } throw new Error(ed.detail || "Failed fetch repos."); } setRepos(await r.json()); } catch (err) { setError(err.message); } finally { setIsLoadingRepos(false); } }; fr(); }, []);
                const handleScan = async (repoFullName) => { setAppState('scanning'); setError(null); try { const sr = await fetch(`${BACKEND_URL}/api/scan`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ repo_name: repoFullName }), credentials: 'include' }); if (!sr.ok) { const ed = await sr.json(); throw new Error(ed.detail || "Failed scan start."); } const { task_id } = await sr.json(); const pi = setInterval(async () => { try { const ssr = await fetch(`${BACKEND_URL}/api/scan/status/${task_id}`, { credentials: 'include' }); if (!ssr.ok) { clearInterval(pi); throw new Error("Failed scan status."); } const sd = await ssr.json(); if (sd.status === 'SUCCESS') { clearInterval(pi); setScanResult(sd.result); setAppState('report'); } else if (sd.status === 'FAILURE') { clearInterval(pi); throw new Error(sd.detail || "Scan failed."); } } catch (err) { clearInterval(pi); setError(err.message); setAppState('repo_selection'); } }, 3000); } catch (err) { setError(err.message); setAppState('repo_selection'); } };
                const handleNewScan = () => { setScanResult(null); setAppState('repo_selection'); };
                const handleGenerateFix = async (issueIndex) => { const i = scanResult.syntaxIssues[issueIndex]; const ui = [...scanResult.syntaxIssues]; ui[issueIndex] = { ...i, isLoadingSuggestion: true }; setScanResult({ ...scanResult, syntaxIssues: ui }); try { const r = await fetch(`${BACKEND_URL}/api/generate-fix`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code_snippet: i.code_snippet, issue_type: i.type, file_path: i.file, line: i.line }), credentials: 'include' }); if (!r.ok) { const ed = await r.json(); throw new Error(ed.detail || "AI fail."); } const d = await r.json(); const fi = [...scanResult.syntaxIssues]; fi[issueIndex] = { ...i, suggestion: d.suggestion, isLoadingSuggestion: false }; setScanResult({ ...scanResult, syntaxIssues: fi }); } catch (err) { const fi = [...scanResult.syntaxIssues]; fi[issueIndex] = { ...i, suggestion: `Error: ${err.message}`, isLoadingSuggestion: false }; setScanResult({ ...scanResult, syntaxIssues: fi }); } };
                const renderMainContent = () => { if (error) { return <div className="fc items-center justify-center h-full tc"><ServerCrash className="w-12 h-12 text-red-400" /><h1 className="t2xl fb text-white mt-6">Error</h1><p className="mt-1 text-gray-400 max-w-md">{error}</p></div>; } switch (appState) { case 'repo_selection': return <RepoSelectionView repos={repos} isLoading={isLoadingRepos} onScan={handleScan} />; case 'scanning': return <ScanningView />; case 'report': return <ReportView result={scanResult} onNewScan={handleNewScan} onGenerateFix={handleGenerateFix} />; default: return <RepoSelectionView repos={repos} isLoading={isLoadingRepos} onScan={handleScan} />; } };
                return <div className="py-8 h-full flex flex-col"><header className="flex justify-between items-center flex-shrink-0"><h1 className="t2xl fb text-white"><span className="text-emerald-400">Py</span>Upgrade</h1><button onClick={onLogout} className="flex items-center bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors"><LogOut className="w-4 h-4 mr-2" />Logout</button></header><main className="flex-grow mt-4 overflow-y-auto">{renderMainContent()}</main></div>;
            };

            const RepoSelectionView = ({ repos, isLoading, onScan }) => {
                 // (Logic remains the same)
                const [selectedRepo, setSelectedRepo] = useState(null);
                useEffect(() => { if (repos && repos.length > 0 && !selectedRepo) { setSelectedRepo(repos[0].full_name); } }, [repos, selectedRepo]);
                if (isLoading) { return <div className="fc items-center justify-center h-full tc"><Loader2 className="w-12 h-12 text-emerald-400 animate-spin" /><h1 className="t2xl fb text-white mt-6">Fetching...</h1></div>; }
                if (repos.length === 0) { return <div className="fc items-center justify-center h-full tc"><FileCode className="w-12 h-12 text-gray-500" /><h1 className="t2xl fb text-white mt-6">No Python Repos Found</h1><p className="mt-1 text-gray-400 max-w-md">No Python repos in GitHub.</p></div>; }
                return <div className="max-w-4xl mx-auto"> <h1 className="t3xl fb text-white">Select Repo</h1><p className="mt-2 text-gray-400">Choose repo to scan.</p><div className="mt-8 space-y-4 max-h-[60vh] overflow-y-auto pr-2">{repos.map(repo => ( <div key={repo.id} onClick={() => setSelectedRepo(repo.full_name)} className={`bg-gray-800/50 border ${selectedRepo === repo.full_name ? 'border-emerald-500 ring-2 ring-emerald-500/30' : 'border-gray-700'} p-4 rounded-lg cursor-pointer transition-all hover:border-emerald-600`}><div className="flex items-center"><input type="radio" name="repo-selection" checked={selectedRepo === repo.full_name} readOnly className="w-4 h-4 text-emerald-600 bg-gray-700 border-gray-600"/><div className="ml-4 flex-grow"><p className="font-semibold text-white flex items-center">{repo.owner.login} / <span className="font-bold">{repo.name}</span>{repo.private && <Lock className="w-3 h-3 ml-2 text-gray-400" />}</p><p className="text-sm text-gray-400">{repo.description}</p></div></div></div>))}</div><div className="mt-8 text-right"><button onClick={() => onScan(selectedRepo)} disabled={!selectedRepo} className="bg-emerald-500 text-white font-semibold px-6 py-3 rounded-lg hover:bg-emerald-600 transition-colors disabled:bg-gray-600 flex items-center ml-auto">Scan Repo <ChevronRight className="w-5 h-5 ml-2" /></button></div></div>;
            };

            const ScanningView = () => ( <div className="fc items-center justify-center h-full tc"><Loader2 className="w-16 h-16 text-emerald-400 animate-spin" /><h1 className="t3xl fb text-white mt-8">Scanning...</h1><p className="mt-2 text-gray-400 max-w-md">Scan started. We'll update when ready.</p></div> );

            const ReportView = ({ result, onNewScan, onGenerateFix }) => {
                 // (Logic remains the same)
                if (!result) return <ScanningView />;
                return <div className="max-w-6xl mx-auto pb-8"><div className="flex justify-between items-start"><div><p className="text-gray-400">Scan Report</p><h1 className="t3xl fb text-white">{result.repoName}</h1></div><button onClick={onNewScan} className="bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded-lg">New Scan</button></div><div className={`mt-6 p-6 rounded-xl bg-gray-800/50 border border-gray-700`}><h3 className="font-semibold text-white flex items-center"><AlertTriangle className={`w-5 h-5 mr-2 text-red-400`}/> Summary</h3><p className="text-gray-400 mt-2">{result.summary}</p></div><div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6"><div className="bg-gray-800/50 border border-gray-700 p-6 rounded-xl"><h3 className="text-lg font-semibold text-white mb-4">Dependencies ({result.dependencies.length})</h3>{result.dependencies.length > 0 ? <div className="space-y-3">{result.dependencies.map(dep => (<div key={dep.name} className={`p-4 rounded-lg border bg-red-500/20 border-red-500/30`}><div className="flex justify-between items-center"><p className={`font-bold text-red-400`}>{dep.name} <span className="text-xs font-mono text-gray-400 ml-2">{dep.version}</span></p><span className={`text-xs font-semibold px-2 py-1 rounded-full bg-red-500/20 text-red-400`}>INCOMPATIBLE</span></div><p className="text-sm text-gray-400 mt-1">{dep.reason}</p></div>))}</div> : <div className="tc py-8 text-gray-400"><CheckCircle2 className="w-8 h-8 mx-auto mb-2"/>No issues found.</div>}</div><div className="bg-gray-800/50 border border-gray-700 p-6 rounded-xl"><h3 className="text-lg font-semibold text-white mb-4">Syntax & AI Suggestions</h3>{result.syntaxIssues.length > 0 ? <div className="space-y-4">{result.syntaxIssues.map((issue, i) => (<div key={i} className="p-4 rounded-lg bg-gray-900/70 border border-gray-700/50"><p className="font-semibold text-yellow-400">{issue.type}</p><p className="text-sm text-gray-300 font-mono">{issue.file}:{issue.line}</p>{issue.suggestion ? <div className="mt-3"><p className="text-xs text-gray-400 font-semibold">DEPRECATED:</p><pre className="bg-red-900/30 text-red-300 p-2 rounded text-xs font-mono mt-1"><code>{issue.code_snippet}</code></pre><p className="text-xs text-gray-400 font-semibold mt-2">AI SUGGESTION:</p><pre className="bg-emerald-900/30 text-emerald-300 p-2 rounded text-xs font-mono mt-1"><code>{issue.suggestion}</code></pre></div> : <div className="mt-3"><p className="text-xs text-gray-400 font-semibold">DEPRECATED:</p><pre className="bg-gray-800 p-2 rounded text-xs font-mono mt-1"><code>{issue.code_snippet}</code></pre></div>}{!issue.suggestion && <div className="mt-3 text-right"><button onClick={() => onGenerateFix(i)} disabled={issue.isLoadingSuggestion} className="inline-flex items-center text-sm bg-emerald-600/50 text-emerald-300 font-semibold py-1.5 px-3 rounded-lg hover:bg-emerald-600/70 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">{issue.isLoadingSuggestion ? <><Loader2 className="w-4 h-4 mr-2 animate-spin"/>Generating...</> : <><Bot className="w-4 h-4 mr-2" /> Generate Fix</>}</button></div>}</div>))}</div> : <div className="tc py-8 text-gray-400"><CheckCircle2 className="w-8 h-8 mx-auto mb-2"/>No syntax issues.</div>}</div></div><div className="bg-gray-800/50 border border-gray-700 p-6 rounded-xl mt-6"><h3 className="text-lg font-semibold text-white mb-4 flex items-center"><Sparkles className="w-5 h-5 mr-2 text-emerald-400" /> Migration Plan</h3><p className="text-gray-400 text-sm mb-4">AI-generated plan.</p><ul className="space-y-3">{result.recommendations.steps.map((step, index) => (<li key={index} className="flex items-start"><CheckCircle2 className="w-5 h-5 text-emerald-400 mt-1 flex-shrink-0" /><span className="ml-3 text-gray-300">{step}</span></li>))}</ul></div></div>;
            };

            // --- Render the Application ---
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(React.createElement(App));
    </script>
</body>
</html>
